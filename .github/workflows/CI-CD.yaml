name: CICD

on:
  workflow_dispatch:


jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Cloning the code"

  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build the code
        run: echo "building the code"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the test-cases
        run: echo "testing the code"
  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the production
        run: echo "deploying the code"
